# ============================================================================
# dsh-achievement-sound —— DSH bundle patch
# ============================================================================
# 把「成就提示音」插件插入当前 profile 的配置树。
# 全部字段都有默认值，所以这里不带 config；要改就在
#   Settings → 插件 → 成就提示音 → 配置
# 或直接给本行加 config: {...}，例如只保留任务完成音、并把冷却放宽到 3 秒：
#
# - insert:
#     - id: achievement-sound
#       name: dsh-achievement-sound
#       config:
#         awaitInput: false
#         cooldownMs: 3000
# ============================================================================

- insert:
    - id: achievement-sound
      name: dsh-achievement-sound
